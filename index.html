<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>جوونه | راهنمای گیاهان آپارتمانی</title>
  <meta name="description" content="جوونه، راهنمای ساده‌ی نگهداری، تکثیر و رفع مشکل گیاهان آپارتمانی.">
  <meta name="theme-color" content="#24594A">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="جوونه">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- آیکون‌های ساده‌ی اپ (همه در همین فایل هستند) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-9.6-10C1.3 7 3.3 4.2 6.6 4.2c2 0 3.6 1 5.4 3 1.8-2 3.4-3 5.4-3 3.3 0 5.3 2.800 4.200 6.300-1.600 5.100-9.600 10-9.600 10z"/></symbol>

      <symbol id="i-back" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 10 5 20 4.500 20 14 15 19.500 6 19.500M5 19c3-5 6-8 10-10.500"/></symbol>
      <symbol id="i-sprout" viewBox="0 0 24 24"><path d="M12 21v-9M12 13C12 9 9 6.500 4.500 6.500 4.500 10.500 7.500 13 12 13zM12 15.500c0-3.200 2.500-5.500 7-5.500 0 3.500-2.800 5.500-7 5.500z"/></symbol>

      <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.500 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z"/></symbol>
      <symbol id="i-pot" viewBox="0 0 24 24"><path d="M4 9h16M5.500 9l1.200 9.300a2 2 0 0 0 2 1.700h6.600a2 2 0 0 0 2-1.700L18.500 9M9 5.500c1 .5 2 .5 3 0s2-.5 3 0"/></symbol>

      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></symbol>

      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>

  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="back" data-action="back" aria-label="بازگشت" style="visibility:hidden"><svg class="ic"><use href="#i-back"/></svg></button>
      <h1 id="page-title">جوونه</h1>
      <span class="topbar-space"></span>
    </header>

    <main id="view" tabindex="-1">
      <p class="loading">در حال بارگذاری…</p>
    </main>

    <nav class="bottom-nav" aria-label="منوی اصلی">
      <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>خانه</span></a>
      <a href="#/favorites" data-nav="favorites"><svg class="ic"><use href="#i-heart"/></svg><span>علاقه‌مندی‌ها</span></a>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <noscript><p style="padding:24px;text-align:center">برای استفاده از جوونه باید جاوااسکریپت فعال باشد.</p></noscript>
  <script src="app.js"></script>
